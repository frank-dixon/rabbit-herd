{# Inline Log weight for one rabbit: a small popover. The form itself is cloned in from hub/_weight_log_form.html; without JS the popover links to the rabbit's own weight form. row: weights_page row. #}
<details class="wt-log" data-weight-log-panel data-log-action="{% url 'weights_log' row.rabbit.pk %}">
  <summary class="wt-btn wt-btn-sm">Log weight<span class="sr-only"> for {{ row.rabbit.name }}</span></summary>
  <a class="popover wt-log-pop" href="{% url 'rabbit_detail' row.rabbit.pk %}?weigh=1#weights" data-weight-log-fallback>Log weight<span class="sr-only"> for {{ row.rabbit.name }}</span></a>
</details>
