{% extends "base.html" %}

{% block title %}Rabbit Herd{% endblock %}

{% block content %}
  <h1 class="text-3xl font-semibold tracking-tight">Rabbit Herd</h1>
  <p class="mt-4 leading-relaxed">
    A private record keeper for a small rabbitry.
  </p>
  <div class="mt-8 flex flex-col items-start gap-3">
    <a class="underline" href="{% url 'login' %}">Sign in</a>
    <a class="underline" href="{% url 'signup' %}">Create an account</a>
    <form method="post" action="{% url 'guest' %}">
      {% csrf_token %}
      <button type="submit" class="underline">Continue as a guest</button>
    </form>
  </div>
{% endblock %}
