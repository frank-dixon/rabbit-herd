{% extends "base.html" %}

{% block title %}Reset password · Rabbit Herd{% endblock %}

{% block content %}
  <h1 class="text-3xl font-semibold tracking-tight">Reset password</h1>
  <p class="mt-4 leading-relaxed">
    Enter the email on the account. If it matches, a reset link will be sent.
  </p>
  <form class="mt-8 space-y-4" method="post">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium" for="{{ form.email.id_for_label }}">Email</label>
      {{ form.email }}
      {{ form.email.errors }}
    </div>
    <button type="submit" class="rounded bg-neutral-800 px-4 py-2 font-medium text-white">
      Send reset link
    </button>
  </form>
{% endblock %}
