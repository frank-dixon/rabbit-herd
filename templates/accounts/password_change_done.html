{% extends "base.html" %}

{% block title %}Password changed · {{ app_name }}{% endblock %}

{% block content %}
  <h1 class="text-[1.75rem] leading-tight font-semibold md:text-[2.25rem]">Password changed</h1>
  <p class="mt-4 leading-relaxed">Your password is updated.</p>
  <div class="mt-8">
    {% url 'index' as index_url %}
    {% include "components/button.html" with label="Back" href=index_url variant="secondary" only %}
  </div>
{% endblock %}
