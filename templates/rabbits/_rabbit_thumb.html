{% load photos %}{# rabbit, main (photo or None), size_class: classes for the box. Coat-tinted swatch when there is no photo. #}
{% if main %}
  <img draggable="false" class="{{ size_class }} object-cover" {% photo_src main sizes|default:"72px" 640 %} alt="" loading="lazy" decoding="async" data-avatar>
{% else %}
  {% coat_swatch rabbit size_class %}
{% endif %}
