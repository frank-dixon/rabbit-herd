{% load photos %}{# rabbit, main (photo or None), size_class: classes for the box. Letter placeholder when there is no photo. #}
{% if main %}
  <img class="{{ size_class }} object-cover" {% photo_src main sizes|default:"72px" 640 %} alt="" loading="lazy" decoding="async">
{% else %}
  <span class="{{ size_class }} flex items-center justify-center bg-neutral-100 font-semibold text-neutral-500" aria-hidden="true">{{ rabbit.name|first|upper }}</span>
{% endif %}
