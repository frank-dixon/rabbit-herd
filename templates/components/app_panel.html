{# Slide-in menu panel (menu button, top left). Phones: pushes the page right. Tablet and up: overlays it. Without JS the button opens /menu/. #}
<nav id="app-menu" class="app-panel" aria-label="Menu" data-menu-panel inert>
  <div class="flex h-14 items-center justify-between border-b border-line px-5">
    <span class="text-base font-semibold tracking-tight">{{ app_name }}</span>
    <button type="button" class="mo-press -mr-2 grid h-10 w-10 place-items-center rounded-md text-muted hover:bg-side hover:text-ink focus:outline-none focus-visible:ring-2 focus-visible:ring-accent" data-menu-close>
      {% include "components/icon.html" with d="M6 6l12 12M18 6 6 18" only %}<span class="sr-only">Close menu</span>
    </button>
  </div>
  {% include "components/menu_list.html" %}
</nav>
