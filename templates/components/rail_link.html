<a href="{{ item.url }}" data-rail-key="{{ item.key }}"{% if group %} data-rail-group="{{ group }}"{% endif %} class="group/rail flex flex-col items-center gap-1 rounded-md px-1 py-2 text-xs font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-accent lg:flex-row lg:gap-3 lg:py-1.5 lg:px-2.5 lg:text-sm {% if item.active %}bg-accent-soft text-accent{% else %}text-ink-2 hover:bg-hover hover:text-ink{% endif %}"{% if item.active %} aria-current="page"{% endif %}>
  <span class="inline-flex transition-transform duration-150 ease-out group-hover/rail:translate-x-0.5 motion-reduce:transition-none motion-reduce:group-hover/rail:translate-x-0">{% include "components/icon.html" with d=item.icon only %}</span>
  <span class="text-center lg:text-left">{{ item.short }}</span>
</a>
