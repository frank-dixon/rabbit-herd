{# One quiet line for guest and demo sessions: never blocks anything. Above the tab bar on phones, along the bottom of the content on wider screens. Wording: pages/copy.py RAIL. #}
<div data-print-hide class="temp-rail" data-temp-rail="{{ temp_rail.kind }}" role="note">
  <span class="temp-rail-text min-w-0 truncate">{{ temp_rail.text }}</span>
  {% if temp_rail.kind == "demo" %}
    <form method="post" action="{% url 'guest' %}" class="shrink-0">{% csrf_token %}<button type="submit" class="temp-rail-action">{{ temp_rail.action }}</button></form>
  {% else %}
    <a class="temp-rail-action shrink-0" href="{% url 'signup' %}">{{ temp_rail.action }}</a>
  {% endif %}
</div>
