{# title: optional heading. body: text shown under the heading. #}
<section class="ruled pt-4">
  {% if title %}
    <h2 class="text-base font-semibold">{{ title }}</h2>
  {% endif %}
  {% if body %}
    <p class="{% if title %}mt-2 {% endif %}leading-relaxed">{{ body }}</p>
  {% endif %}
</section>
