{# The shared stat cards (same .wt-stat look as Weights and Costs). stats: [{label, value, note, tone}]; tone "r" turns the number red. #}
<dl class="wt-stats" aria-label="{{ label|default:'Summary' }}" data-stat-cards>
  {% for s in stats %}<div class="wt-stat"><dt>{{ s.label }}</dt><dd class="num{% if s.tone == 'r' %} text-danger{% endif %}">{{ s.value }}</dd><p>{{ s.note|default:"&nbsp;" }}</p></div>{% endfor %}
</dl>
