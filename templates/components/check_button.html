{# The shared done check: a 24px outlined circle inside a 44px button. Pass label (names the task for screen readers). #}
<button type="submit" class="check-btn mo-press" title="Mark done"><span class="check-btn-ring" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5 10 16.5 18 8"/></svg></span><span class="sr-only">Mark done: {{ label }}</span></button>
