{# Bottom tabs on phones. Pages with their own fixed action bar (edit summary, cards) leave these out. #}
<nav data-print-hide class="fixed inset-x-0 bottom-0 z-20 border-t border-line bg-surface/95 pb-[env(safe-area-inset-bottom)] backdrop-blur md:hidden" aria-label="Main" data-app-tabs>
  <ul class="grid grid-cols-4">
    {% for item in app_tabs %}
      <li>
        <a href="{{ item.url }}" class="relative flex min-h-14 flex-col items-center justify-center gap-0.5 px-1 py-2 text-[11px] font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-accent {% if item.active %}text-accent{% else %}text-muted{% endif %}"{% if item.active %} aria-current="page"{% endif %}>
          {% if item.active %}<span class="absolute inset-x-6 top-0 h-0.5 rounded-b bg-second" aria-hidden="true"></span>{% endif %}
          {% include "components/icon.html" with d=item.icon only %}
          <span>{{ item.short }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
