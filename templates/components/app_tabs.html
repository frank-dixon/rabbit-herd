{# Bottom tabs on phones. Pages with their own fixed action bar (edit summary, cards) leave these out. #}
<nav data-print-hide class="fixed inset-x-0 bottom-0 z-20 border-t border-neutral-300 bg-white pb-[env(safe-area-inset-bottom)] md:hidden" aria-label="Main" data-app-tabs>
  <ul class="grid grid-cols-4">
    {% for item in app_tabs %}
      <li>
        <a href="{{ item.url }}" class="flex min-h-14 flex-col items-center justify-center gap-0.5 px-1 py-2 text-xs focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-neutral-900 {% if item.active %}font-semibold text-neutral-900{% else %}text-neutral-600{% endif %}"{% if item.active %} aria-current="page"{% endif %}>
          {% include "components/icon.html" with d=item.icon only %}
          <span>{{ item.short }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
