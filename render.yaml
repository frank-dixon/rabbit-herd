# Free Python web service. Point DATABASE_URL at a free Neon database
# or a free Render Postgres instance when the blueprint asks for it.
services:
  - type: web
    name: rabbit-herd
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn rabbit_herd.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: NODE_VERSION
        value: "22.14.0"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "Bramble Burrow <noreply@example.com>"
